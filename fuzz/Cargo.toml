[package]
name = "fastfind-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fastfind-core = { path = "../crates/fastfind-core" }
zip = { version = "8", default-features = false, features = ["deflate"] }

# Not part of the main workspace: fuzzing needs the nightly toolchain.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "seed"
path = "src/seed.rs"
test = false
doc = false

[[bin]]
name = "doc"
path = "fuzz_targets/doc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docx"
path = "fuzz_targets/docx.rs"
test = false
doc = false
bench = false

