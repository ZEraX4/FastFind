[package]
name = "fastfind-core"
description = "FastFind search engine: scanning, parsing, indexing and querying"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
tantivy = { version = "0.26", default-features = false, features = ["mmap", "zstd-compression", "lz4-compression"] }
rusqlite = { version = "0.40", features = ["bundled"] }
calamine = "0.36"
cfb = "0.15"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
encoding_rs = "0.8"
chardetng = "1"
pdfium-render = "0.9"
pdf-extract = "0.12"
notify = "8"
rayon = "1.12"
regex = "1.13"
regex-syntax = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
tracing-appender = "0.2"
lru = "0.18"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
html-escape = "0.2"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
zstd = "0.14"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
