name: Fuzz

on:
  pull_request:
    paths: ["crates/fastfind-core/src/parsers/**", "crates/fastfind-core/src/search/**", "crates/fastfind-core/src/analysis.rs", "fuzz/**"]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [doc, xls, ppt, docx, xlsx, pptx, odf, epub, rtf, html, xml, json, plain, eml, msg, zip, query]
    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '120' || inputs.seconds || '600' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          cache-bin: true
      - run: cargo install cargo-fuzz --locked
      - name: Seed
        working-directory: fuzz
        run: cargo run --bin seed
      - name: Fuzz
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} -- -max_total_time=$SECONDS_PER_TARGET -timeout=30 -rss_limit_mb=2048
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
