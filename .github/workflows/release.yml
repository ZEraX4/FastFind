name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            pdfium: pwsh scripts/fetch-pdfium.ps1 -Platform win-x64
            args: ""
          - name: macOS universal
            os: macos-latest
            pdfium: scripts/fetch-pdfium.sh chromium/8066 mac-univ
            args: --target universal-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            pdfium: scripts/fetch-pdfium.sh chromium/8066 linux-x64
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check update signing is configured
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if grep -q REPLACE_WITH_UPDATER_PUBLIC_KEY src-tauri/tauri.conf.json; then
            echo "::error::Set plugins.updater.pubkey in src-tauri/tauri.conf.json (see README, Releasing)."; exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets."; exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Fetch PDFium
        run: ${{ matrix.pdfium }}
      - run: npm ci
      # Update signing (required): TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) sign the update
      # packages and tauri-action uploads latest.json, the manifest installed copies check.
      # OS code signing (optional): add APPLE_* (notarisation) and a Windows certificate.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: FastFind ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
