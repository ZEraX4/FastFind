name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            pdfium: pwsh scripts/fetch-pdfium.ps1 -Platform win-x64
            args: ""
          - name: macOS universal
            os: macos-latest
            pdfium: scripts/fetch-pdfium.sh chromium/8066 mac-univ
            args: --target universal-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            pdfium: scripts/fetch-pdfium.sh chromium/8066 linux-x64
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Fetch PDFium
        run: ${{ matrix.pdfium }}
      - run: npm ci
      # Signing: set TAURI_SIGNING_PRIVATE_KEY (updater), APPLE_* (notarisation) and a
      # Windows code-signing certificate as repository secrets to produce signed installers.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: FastFind ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
